# tmux

set -g default-terminal 'tmux-256color'
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:RGB:extkeys'

# mouse mode (clickable panes, selection, etc)
set -g mouse on
# pass focus event to cli apps running in tmux
set -g focus-events on

# set prefix to C-a
set -g prefix C-a
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
set -g status-keys vi
setw -g mode-keys vi

# enable updating the outer terminal title
set -g set-titles on
# customize what the title string displays
set -g set-titles-string '#{b:pane_current_path} · #{pane_current_command}'

# navigate panes with prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-1 select-window -t :=1
bind -n C-2 select-window -t :=2
bind -n C-3 select-window -t :=3
bind -n C-4 select-window -t :=4
bind -n C-5 select-window -t :=5
bind -n C-6 select-window -t :=6
bind -n C-7 select-window -t :=7
bind -n C-8 select-window -t :=8
bind -n C-9 select-window -t :=9
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# C-v creates a side-by-side pane; C-h creates a stacked pane.
bind C-v split-window -h -c '#{pane_current_path}'
bind C-h split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Colors follow Ghostty's active Ayu theme automatically.
set -g @status-bg '#{?#{==:#{client_theme},light},colour7,colour0}'
set -g @status-fg '#{?#{==:#{client_theme},light},colour0,colour7}'
set -g @window-active-bg '#{?#{==:#{client_theme},light},colour0,colour7}'
set -g @window-active-fg '#{?#{==:#{client_theme},light},colour15,colour0}'
set -g @primary-colour colour3
set -g @info-colour colour4
set -g @muted-colour colour8
set -g @contrast-colour colour0

set -g status-position bottom
set -g status-left-length 24
set -g status-right-length 80
set -g window-status-separator ''
set -g status-style 'bg=#{E:@status-bg},fg=#{E:@status-fg}'
set -g status-left '#[fg=#{E:@contrast-colour},bg=#{E:@primary-colour},bold] #S#[fg=#{E:@muted-colour},nobold]▕'
set -g window-status-format '#[default] #I #W#[fg=#{E:@muted-colour}]▕'
set -g window-status-current-format '#[fg=#{E:@window-active-fg},bg=#{E:@window-active-bg},bold] #I #W#{?window_zoomed_flag, Z,}#[fg=#{E:@muted-colour},nobold]▕'
set -g status-right "#[fg=#{E:@contrast-colour},bg=#{E:@info-colour},nobold] #[bold]RAM#[nobold] #(memory_pressure -Q | awk '/System-wide memory free percentage/ { print 100 - \$5 }')%% │ #[bold]BAT#[nobold] #(pmset -g batt | awk 'NR == 2 { print 0 + \$3 }')%% │ #[bold]%H:%M#[nobold] "
set -g pane-border-style 'fg=#{E:@muted-colour}'
set -g pane-active-border-style 'fg=#{E:@primary-colour}'
set -gF display-panes-colour '#{@muted-colour}'
set -gF display-panes-active-colour '#{@primary-colour}'
set -g message-style 'fg=#{E:@contrast-colour},bg=#{E:@primary-colour},bold'
set -g mode-style 'fg=#{E:@contrast-colour},bg=#{E:@primary-colour}'

# plugins (prefix + I to install, prefix + U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# initialize tpm (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
