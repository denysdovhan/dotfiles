# tmux

set -g default-terminal 'tmux-256color'
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:RGB:extkeys:hyperlinks'
set -g allow-passthrough all

# mouse mode (clickable panes, selection, etc)
set -g mouse on
# pass focus event to cli apps running in tmux
set -g focus-events on

# set prefix to C-a
set -g prefix C-a
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
set -g status-keys vi
setw -g mode-keys vi

# enable updating the outer terminal title
set -g set-titles on
# customize what the title string displays
set -g set-titles-string '#{b:pane_current_path} · #{pane_current_command}'

# navigate panes with prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-1 select-window -t :=1
bind -n C-2 select-window -t :=2
bind -n C-3 select-window -t :=3
bind -n C-4 select-window -t :=4
bind -n C-5 select-window -t :=5
bind -n C-6 select-window -t :=6
bind -n C-7 select-window -t :=7
bind -n C-8 select-window -t :=8
bind -n C-9 select-window -t :=9
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Move the current window left/right; repeat without pressing the prefix again.
# Use its ID because an empty source can select a marked pane's window.
bind -r S-Left run-shell "tmux -S '#{socket_path}' swap-window -d -s '#{window_id}' -t '#{session_id}:-1'"
bind -r S-Right run-shell "tmux -S '#{socket_path}' swap-window -d -s '#{window_id}' -t '#{session_id}:+1'"

# C-v creates a side-by-side pane; C-h creates a stacked pane.
bind C-v split-window -h -c '#{pane_current_path}'
bind C-h split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# plugins (prefix + I to install, prefix + U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'denysdovhan/tmux-lean'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# initialize tpm (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
